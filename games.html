<html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:;">
    <!-- <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=.25,maximum-scale=12.0,user-scalable=yes"> -->
    <div id="head">
        <img src="images/bannertestohthomas1.png" id="headerimg" class="center" usemap="#ohthomasmap" draggable="false"/>
        <script src="./js/changeBanner.js"></script>
    </div>
</head>

<link rel="shortcut icon" href="images/mariojump.png">
<link rel="icon" href="images/mariojump.png">
<link rel="stylesheet" type="text/css" href="css/main.css"/>
<link rel="stylesheet" type="text/css" href="css/game.css"/>

<body>
    
    <div id="linksWrapper"> 
        <div class="gameLinkTypes" id="gameLinkTypes">
            <div id="linksDescriber">
                <a><img src="images/browsergames.png" alt="Browser games" id="gameTypeHolderImage" draggable="false"/></a>
                <div id="linksDescriberArrow">
                    <a><img src="images/downarrow.png"  draggable="false"></a>
                </div>
            </div>
            <div class="gameLinkTypes-options" id="gameLinkTypes-options">
                <a><img src="images/browser.png" alt="Browser games" id="browserGames" class="btn" draggable="false"/></a>
                <div class="gltPadding">
                    <a><img src="images/downloadable.png" alt="Downloadable games" id="downloadableGames" class="btn" draggable="false"/></a>
                </div>
            </div>
        </div>
        

        <div id="linksContainer">
            <a><img src="images/javalava.png" id="javaLavaGameButton" class="btnJavaLava" width="288" height="64" alt="Java Lava" draggable="false"/></a>
            <div id="gameTextDiv"></div>
        </div>

    </div>
    
    <div id="gameContainer">
        <template id="sample">
            <div>
                <h1 class="title"></h1>
                <p class="desc"></p>
                <small class="category"></small>
                <div><strong class="date"></strong> - <span class="topic"></span></div>
            </div>
        </template>
    <script src="./js/fetchGames.js"></script>
    <script src="./js/gameDropdownMenu.js"></script>
    <script src="./js/animation.js"></script>
    <script src="./js/starBuildUp.js"></script>
    <script src="./js/mousePosition.js"></script>
    <script src="./js/starExplosion.js"></script>
    <script src="./js/backgroundStars.js"></script>
